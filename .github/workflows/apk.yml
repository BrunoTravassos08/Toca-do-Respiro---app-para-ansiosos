name: Gerar APK

# Só roda quando alguém pede, em Actions > Gerar APK > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app web para o Android
        run: npx cap sync android

      - name: Definir a versão
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Gerar e assinar o APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias toca \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out ../toca-do-respiro.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify ../toca-do-respiro.apk
            rm -f "$RUNNER_TEMP/release.jks"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Chave de assinatura não configurada. Gerando APK de teste (debug)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../toca-do-respiro.apk
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: toca-do-respiro-apk
          path: toca-do-respiro.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Toca do Respiro 1.0.${{ github.run_number }}
          make_latest: true
          files: toca-do-respiro.apk
          body: |
            Baixe o arquivo **toca-do-respiro.apk** abaixo e abra no celular Android.
            Se o Android perguntar, permita "instalar apps desconhecidos" para o navegador ou gerenciador de arquivos.

            Assinatura: ${{ env.SIGNED == 'release' && 'oficial' || 'de teste (atualizações podem exigir desinstalar a versão anterior)' }}
